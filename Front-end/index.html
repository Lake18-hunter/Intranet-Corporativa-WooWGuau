<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WooWGuau - Iniciar Sesión</title>
    <!-- Fuentes de Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Iconos de Lucide -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Enlace a la hoja de estilos externa -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="login-card">
        <!-- Encabezado y Logo WooWGuau -->
        <div class="header">
            <div class="logo-box">
                <i data-lucide="dog" class="logo-icon"></i>
            </div>
            <h1>WooWGuau</h1>
            <p class="subtitle">¡Hola de nuevo! Ingresa a tu cuenta para cuidar a tus mascotas</p>
        </div>

        <!-- Formulario de Inicio de Sesión -->
        <form id="loginForm" onsubmit="event.preventDefault(); handleLogin();">
            <!-- Campo Correo -->
            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <div class="input-wrapper">
                    <i data-lucide="mail" class="input-icon"></i>
                    <input type="email" id="email" placeholder="ejemplo@woowguau.com" required>
                </div>
            </div>

            <!-- Campo Contraseña -->
            <div class="form-group">
                <label for="password">Contraseña</label>
                <div class="input-wrapper">
                    <i data-lucide="lock" class="input-icon"></i>
                    <input type="password" id="password" placeholder="••••••••" required>
                    <button type="button" class="toggle-password" onclick="togglePasswordVisibility()" aria-label="Mostrar u ocultar contraseña">
                        <i data-lucide="eye" id="eyeIcon"></i>
                    </button>
                </div>
            </div>

            <!-- Recordarme y Olvidé contraseña -->
            <div class="options-row">
                <label class="remember-me">
                    <input type="checkbox" id="remember">
                    <span>Recordarme</span>
                </label>
                <a href="#" class="forgot-link">¿Olvidaste tu contraseña?</a>
            </div>

            <!-- Botón de Enviar -->
            <button type="submit" class="btn-submit">
                <span>Iniciar Sesión</span>
                <i data-lucide="paw-print"></i>
            </button>
        </form>

        <!-- Mensaje de estado al enviar -->
        <div id="statusMessage" class="status-message"></div>

        <!-- Pie de tarjeta / Enlace de registro -->
        <div class="footer-links">
            ¿Aún no tienes cuenta? <a href="#">Regístrate aquí</a>
        </div>
    </div>

    <!-- Script para iconos e interacciones breves -->
    <script>
        // Inicializar iconos de Lucide
        lucide.createIcons();

        // Alternar visibilidad de contraseña
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.setAttribute('data-lucide', 'eye-off');
            } else {
                passwordInput.type = 'password';
                eyeIcon.setAttribute('data-lucide', 'eye');
            }
            lucide.createIcons();
        }

        // Simular inicio de sesión exitoso
        function handleLogin() {
            const email = document.getElementById('email').value;
            const statusMsg = document.getElementById('statusMessage');
            
            statusMsg.style.display = 'block';
            statusMsg.className = 'status-message success';
            statusMsg.innerHTML = `¡Bienvenido/a de nuevo a WooWGuau! 🐾`;
        }
    </script>
</body>
</html>
